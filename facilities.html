<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay Paralaya</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <a href="#maincontent">skip to main content</a>

 <header>
    <nav>
      <div>
      <img src="img/logo.png" alt="community logo">
    </div>
      <a href="index.html">Home</a> |
      <a href="officials.html">Officials</a> |
      <a href="projects.html">Projects</a> |
      <a href="#">Facilities</a> |
        <a href="announcements.html">Announcements</a> |
      <a href="adminlogin.html">Admin</a>
    </nav>
  </header>

  <main id="maincontent">
    <section>
      <h2>facilities & request</h2>
      <form>
        <label for="search">search facilities</label>
        <input type="text" id="search" name="search">
        <button type="submit">check availability</button>
      </form>
    </section>

    <section>
      <h2>facilities catalog</h2>
      <article>
        <h3>Multipurpose Hall</h3>
        <figure>
            <img src="img/facilities/function hall.jpg" alt="multipurpose hall 1 interior view" width="75%" height="40%">
        </figure>
        <button type="button">book</button>
        <button type="button">view details</button>
      </article>
      
      <article>
        <h3>Sports Complex</h3>
        <figure>
          <img src="img/facilities/basketballcourt4.jpg" alt="sports complex interior view" width="75%" height="40%">
        </figure>
        <button type="button">book</button>
        <button type="button">view details</button>
      </article>

      <article>
        <h3>Health Center</h3>
        <figure>
          <img src="img/facilities/clinic.jpg" alt="health center interior view" width="75%" height="40%">
        </figure>
        <button type="button">book</button>
        <button type="button">view details</button>
      </article>

      <article>
        <h3>Library/Study Area</h3>
        <figure>
          <img src="img/facilities/library.jpg" alt="library interior view" width="75%" height="40%">
        </figure>
        <button type="button">book</button>
        <button type="button">view details</button>
      </article>
    </section>

    <section>
      <h2>booking form</h2>
      <form>
        <label for="facility">facility</label>
        <input type="text" id="facility" name="facility" placeholder="choose facility">

        <label for="date">date</label>
        <input type="date" id="date" name="date">

        <label for="time">time</label>
        <input type="time" id="time" name="time">

        <label for="purpose">purpose</label>
        <input type="text" id="purpose" name="purpose" placeholder="e.g., birthday, meeting">

        <label for="contact">contact info</label>
        <input type="text" id="contact" name="contact" placeholder="name, phone, email">

        <button type="submit">book</button>
        <button type="reset">clear</button>
      </form>
    </section>
  </main>

<footer>

</footer>


</body>
</html>
